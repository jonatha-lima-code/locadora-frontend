<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Equipamentos</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4">📦 Cadastro de Equipamentos</h2>

<!-- FORM -->
<div class="card mb-4">
    <div class="card-body">
        <form id="equipamentoForm">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Identificação</label>
                    <input type="text" class="form-control" id="identificacao" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipo</label>
                    <input type="text" class="form-control" id="tipo" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="descricao">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="status" required>
                        <option value="DISPONIVEL">DISPONÍVEL</option>
                        <option value="ALUGADO">ALUGADO</option>
                        <option value="PENDENTE">PENDENTE</option>
                        <option value="DEVOLVIDO">DEVOLVIDO</option>
                        <option value="CANCELADO">CANCELADO</option>
                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Categoria</label>
                    <select class="form-select" id="categoriaId">
                        <option value="">-- Selecione --</option>
                        <option value="1">Câmeras</option>
                        <option value="2">Iluminação</option>
                        <option value="3">Áudio</option>
                        <option value="4">Acessórios</option>
                    </select>
                </div>
            </div>

            <div class="mt-3">
                <button 
                    type="submit" 
                    class="btn btn-primary"
                    id="btnSalvar"
                >
                    💾 Cadastrar Equipamento
                </button>
            
                <button 
                    type="button"
                    class="btn btn-secondary ms-2 d-none"
                    id="btnCancelarEdicao"
                >
                    ❌ Cancelar
                </button>
            </div>
            
        </form>
    </div>
</div>

    <!-- TABELA -->
    <div class="card">
        <div class="card-body">
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th></th>
                        <th>Identificação</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Categoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="equipamentosTable"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="modal-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/shared/loader.js"></script>

<script src="../js/equipamentos/equipamentos.api.js"></script>
<script src="../js/equipamentos/equipamentos.dom.js"></script>
<script src="../js/equipamentos/equipamentos.page.js"></script>

</body>
</html>
