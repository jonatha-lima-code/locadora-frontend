<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow p-4" style="width: 100%; max-width: 420px;">

        <div class="text-center mb-4">
            <h3 class="mb-1">🔐 Acesso ao Sistema</h3>
            <small class="text-muted">
                Use suas credenciais para entrar
            </small>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="admin@email.com"
                    required
                />
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input
                    type="password"
                    id="senha"
                    class="form-control"
                    placeholder="123456"
                    required
                />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                Entrar
            </button>

        </form>

        <!-- DIVISOR -->
        <div class="text-center mb-3">
            <small class="text-muted">ou</small>
        </div>

        <!-- LOGIN GOOGLE -->
        <button
            id="btnGoogle"
            class="btn btn-outline-dark w-100 mb-3"
        >
            Entrar com Google
        </button>

        <!-- MOCK INFO -->
        <div class="alert alert-info mt-3 small">
            <strong>Modo Mock:</strong><br>
            Email: <code>admin@email.com</code><br>
            Senha: <code>123456</code>
        </div>

    </div>
</div>
